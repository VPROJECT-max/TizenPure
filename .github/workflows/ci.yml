name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node tools/build-launcher.mjs
      - run: npm run compat
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "cli[dev]"
      - run: ruff check cli/src cli/tests
      - run: ruff format --check cli/src cli/tests
      - run: pytest cli/tests -q
      - run: tizenpure dns lint
  secrets-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No certificates, keys or private addresses committed
        run: |
          if git ls-files | grep -E '\.(p12|pem|key|wgt)$|password\.txt|device-profile\.xml'; then exit 1; fi
          if git grep -nE '\b(192\.168|10\.[0-9]+\.[0-9]+)\.[0-9]+\b' -- . ':!cli/tests' ':!tests' ':!docs/development.md'; then
            echo "Private IP address found in committed files"; exit 1; fi
