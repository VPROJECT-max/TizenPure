name: Release assets
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm run compat
      - name: Bundle the launcher into the CLI
        shell: pwsh
        run: Copy-Item -Recurse dist/launcher cli/src/tizenpure/data/launcher
      - run: pip install -e "cli[dev]" pyinstaller
      - run: pytest cli/tests -q
      - run: pyinstaller --onefile --name tizenpure --collect-data tizenpure cli/tools/entry.py
      - name: Unsigned launcher package for advanced users
        run: tizenpure build -o dist/TizenPure-unsigned.wgt
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tizenpure.exe dist/TizenPure-unsigned.wgt --clobber
