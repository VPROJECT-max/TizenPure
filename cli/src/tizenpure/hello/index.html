<!doctype html>
<html><head><meta charset="utf-8"><title>TizenPure Hello</title>
<style>html,body{margin:0;height:100%;background:#0b0d12;color:#f5f5f7;font:500 48px/1.3 system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
small{font-size:26px;color:#9aa0aa}</style></head>
<body><main><div>TizenPure signing works.</div><small id="ua"></small><small>Press Back to close.</small></main>
<script>
document.getElementById("ua").textContent = navigator.userAgent;
document.addEventListener("keydown", function (e) {
  if (e.keyCode === 10009) { try { tizen.application.getCurrentApplication().exit(); } catch (x) { window.close(); } }
});
</script></body></html>
